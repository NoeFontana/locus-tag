[workspace]
members = [
    "crates/locus-core",
    "crates/locus-py",
    "xtask",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny" # Force explicit allow
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(multiversion_simd)',
    'cfg(simd)',
    'cfg(target_feature, values("avx2", "bmi1", "bmi2", "popcnt", "lzcnt", "avx512f", "avx512bw", "avx512dq", "avx512vl", "neon", "retpoline", "retpoline-indirect-branches", "retpoline-indirect-calls"))'
] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny" # Production safety
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
panic = "deny"
cast_possible_truncation = "allow" # Common in image processing
cast_precision_loss = "allow" # f64 has enough precision for pixel coordinates
doc_markdown = "allow" # Avoids false positives with "AprilTag" etc.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 0
debug = 1 # Line tables only: fast links, low disk usage, keeps file:line in panic backtraces
split-debuginfo = "unpacked" # Keeps debug info in object files instead of duplicating across 50+ test binaries

# Optimize heavy dependencies once; strip their debug info so test builds are fast and lean.
[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.test]
inherits = "dev"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
