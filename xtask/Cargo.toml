[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Repository automation: reproducible comparative benchmarking against pinned reference detectors."

# Deliberately dependency-free: this crate only orchestrates processes
# (git, cmake, c++, uv). It must never pull new crates into the workspace graph.
[dependencies]

[lints]
workspace = true

# Internal automation: never versioned or published with the crates.
[package.metadata.release]
release = false
