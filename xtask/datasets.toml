[euroc]
description = "EuRoC MAV cam_april calibration sequence (6x6 Kalibr AprilGrid, 2-bit tag border), cam0 + cam1"
kind = "hf-archive"
# Private mirror: ETH's original static host is decommissioned and the Research Collection
# (DOI 10.3929/ethz-b-000690084) is often blocked by sandboxed egress allowlists.
# Requires a Hugging Face token with read access (`hf auth login` or HF_TOKEN).
repo = "NoeFontana/euroc-mav-cam-april-mirror"
revision = "126678ebcaf8ee83a8998d12e07c2d9589cee320"
files = ["cam_april.zip"]
dest = "tests/data/euroc"
env = "LOCUS_EUROC_DATASET_DIR"
ready = ["cam_april/mav0"]
license = "In Copyright – Non-Commercial Use Permitted (rightsstatements.org InC-NC/1.0)"
citation = "Burri et al., The EuRoC micro aerial vehicle datasets, IJRR 35(10), 2016. doi:10.1177/0278364915620033"
source_url = "https://doi.org/10.3929/ethz-b-000690084"
consumers = ["regression_euroc.rs", "tests/test_euroc.py", "cargo xtask sota (euroc)"]

[liu4k]
description = "Liu4K: 924 4K photos with alpha-blended ARUCO_MIP_36h12 markers (aruco_nano paper)"
kind = "url-zip"
url = "https://zenodo.org/api/records/18667018/files/liu4k.zip/content"
md5 = "e8fafe5444a9e346f25123151ef1a699"  # from the Zenodo record metadata
size = 4015411869
dest = "tests/data/liu4k"
ready = ["liu4k_markers_1024"]
license = "CC-BY-4.0"
citation = "Muñoz-Salinas, R. Liu4K dataset employed for Aruco_Nano paper. Zenodo (2026). doi:10.5281/zenodo.18667018"
source_url = "https://doi.org/10.5281/zenodo.18667018"
consumers = ["bench real --dataset liu4k", "cargo xtask sota (liu4k)"]
