# Single source of truth for every external dataset Locus benchmarks or tests against.
#
#   cargo xtask data list | fetch <name...|--all> | verify [name...]
#
# Implementation: tools/bench/dataset_registry.py (shared by the bench CLI, pytest helpers and
# `cargo xtask sota`). Rust integration tests and Python loaders read the same `dest`
# paths, so moving a dataset means editing this file only.
#
# Every remote source is pinned: Hugging Face entries by repository commit (`revision`;
# LFS objects are additionally sha256-verified by huggingface_hub), direct URLs by
# checksum. Bumping a pin is a deliberate, reviewable change; `verify` flags local
# copies fetched from a different pin (stamp file `.locus-dataset.json` in `dest`).
#
# Fields
#   kind        hf-hub-subsets | hf-archive | url-zip
#   dest        local directory, relative to the repository root
#   ready       path(s) under `dest` whose existence means "already fetched" (they only
#               appear on success: archives are staged, then renamed into place)
#   env         optional variable that relocates the dataset (read by the Rust tests too)
#   license     as stated by the source; `citation` / `source_url` for attribution
#
# Nothing fetched here is committed, packaged in wheels/sdist, or republished.

[hub]
description = "Locus synthetic render-tag / board / distortion suites (Blender), one directory per config"
kind = "hf-hub-subsets"
repo = "NoeFontana/locus-tag-bench"
revision = "5346835a9ed350828472a4c83d6e3999cf94fefb"
dest = "tests/data/hub_cache"
env = "LOCUS_HUB_DATASET_DIR"
# Default subsets for `fetch hub` (all configs: `--subsets all`).
subsets = [
    "locus_v1_tag36h11_640x480",
    "locus_v1_tag36h11_1280x720",
    "locus_v1_tag36h11_1920x1080",
    "locus_v1_tag36h11_3840x2160",
    "locus_v1_high_iso_1920x1080",
    "locus_v1_low_key_1920x1080",
    "locus_v1_raw_pipeline_1920x1080",
    "locus_v1_tag16h5_1920x1080",
]
license = "MIT"
source_url = "https://huggingface.co/datasets/NoeFontana/locus-tag-bench"
consumers = ["regression_render_tag*.rs", "regression_board_hub.rs", "regression_distortion_hub.rs", "bench real --hub-config", "bench tune / sweep", "cargo xtask sota (hub-*)"]

[icra2020-forward]
description = "ICRA 2020 AprilTag localization-accuracy dataset, forward scenario"
