# Board renders (fetch with `cargo xtask sota fetch hub-aprilgrid` etc.; not in the default
# hub subsets). Scored at marker level. The render-tag AprilGrid prints a 1-bit border
# (verified on the images), unlike the 2-bit Kalibr target of EuRoC.
[sota.hub-aprilgrid]
data = "hub"
subset = "aprilgrid_golden_v1_1920x1080"
images = "images/*.png"
family = "AprilTag36h11"
opencv_dict = "APRILTAG_36h11"
apriltag_family = "tag36h11"
border_bits = 1
scorer = "gt-hub"
gt = "rich_truth.json"
gt_convention = "locus"

# Lens-distorted board renders: the same 1-bit AprilGrid seen through Brown-Conrady and
