source_url = "https://doi.org/10.5281/zenodo.18667018"
consumers = ["bench real --dataset liu4k", "cargo xtask sota (liu4k)"]

# ── Comparative benchmarks (`cargo xtask sota`) ──────────────────────────────────────────
#
# `[sota.<name>]` declares how one benchmark runs on a dataset above. It is not a dataset
# itself (the registry skips this table); `tools/bench/sota/spec.py` resolves it for xtask.
#
# Fields
#   data            registry entry to fetch (`hub` entries also name their `subset`)
#   images          glob, relative to the registry `dest` (and subset), of the frames to run
#   family          Locus `TagFamily`; `opencv_dict` the cv::aruco dictionary (`refrun`)
#   apriltag_family AprilTag 3 family, when the layout is one AprilTag 3 can decode
#   border_bits     black-border width in bits (Kalibr AprilGrid prints 2)
#   scorer          liu4k (aruco_nano testperf rule) | euroc (GT-free board protocol) |
#                   gt-csv (ICRA `tags.csv`) | gt-hub (render-tag `rich_truth.json`)
#   gt              ground-truth file, relative to the same root as `images`
#   gt_convention   pixel-centre convention of the GT corners: "opencv" (integer centres) or
#                   "locus" (+0.5); every scorer compares in the OpenCV convention
#   unsupported     reference -> reason it cannot decode the dataset *as published*; it is
#                   skipped unless `--include-unsupported`, and never patched

[sota.liu4k]
data = "liu4k"
images = "liu4k_markers_1024/*.jpg"
family = "ArUcoMip36h12"
opencv_dict = "ARUCO_MIP_36h12"
border_bits = 1
scorer = "liu4k"
gt_convention = "opencv"

[sota.euroc]
data = "euroc"
images = "cam_april/mav0/cam0/data/*.png"
family = "AprilTag36h11"
opencv_dict = "APRILTAG_36h11"
apriltag_family = "tag36h11"
border_bits = 2
scorer = "euroc"
gt_convention = "opencv"
[sota.euroc.unsupported]
aruco_nano = "2-bit black border (Kalibr AprilGrid): its bit grid is hard-coded to markerSize + 2"
apriltag3 = "2-bit black border (Kalibr AprilGrid): tag36h11 layout fixes a 1-bit border"

[sota.icra-forward]
data = "icra2020-forward"
images = "forward/pure_tags_images/*.png"
family = "AprilTag36h11"
opencv_dict = "APRILTAG_36h11"
apriltag_family = "tag36h11"
border_bits = 1
scorer = "gt-csv"
gt = "forward/tags.csv"
gt_convention = "locus"

